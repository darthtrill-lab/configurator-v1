<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Design your Wundershed</title>
<meta name="description" content="Configure a Wundershed backyard studio in 3D, see the price, and view it in your yard in AR.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script>
  window.WS_CDN = {
    hdri: 'https://cdn.jsdelivr.net/npm/@pmndrs/assets@1.7.0/hdri',
    qr: 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js'
  };
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
:root{--ground:#F6F3EE;--surface:#fff;--ink:#2B2A28;--ink-2:#5E5A54;--ink-3:#8A847C;--rule:#E3DCD2;--rule-2:#CFC6B8;
  --accent:#E75800;--accent-soft:#FBE9DD;--ok:#2F7A4D;--shadow:0 1px 0 rgba(43,42,40,.04),0 18px 40px -28px rgba(43,42,40,.55)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font:15px/1.5 Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--rule);background:var(--surface)}
.brand{font-weight:700;letter-spacing:.14em;font-size:13px}
.brand b{color:var(--accent)}
.mname{display:flex;flex-direction:column;line-height:1.2}
.mname strong{font-size:16px}
.mname span{font:12px 'IBM Plex Mono',monospace;color:var(--ink-3)}
.hprice{margin-left:auto;text-align:right;line-height:1.2}
.hprice strong{font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums}
.hprice span{display:block;font-size:11.5px;color:var(--ink-3)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 420px;height:calc(100% - 61px)}
.stagewrap{position:relative;min-height:320px;background:#dcd6cc}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.ov{position:absolute;display:flex;gap:6px;z-index:2}
.ov.tl{left:14px;top:14px}.ov.tr{right:14px;top:14px}.ov.bl{left:14px;bottom:14px}.ov.br{right:14px;bottom:14px}
.ob{font:600 12px Archivo,sans-serif;padding:7px 11px;border-radius:999px;border:1px solid rgba(43,42,40,.12);background:rgba(255,255,255,.86);color:var(--ink-2);cursor:pointer;backdrop-filter:blur(6px)}
.ob[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.ob:hover{border-color:var(--accent)}
.arbtn{font:700 14px Archivo,sans-serif;padding:12px 18px;border-radius:999px;border:0;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px -10px rgba(231,88,0,.8)}
.arbtn svg{width:18px;height:18px}
aside{display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--rule);min-height:0}
.stepper{position:relative;padding:12px 16px 0}
#steps{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.step{flex:1 0 auto;font:600 11.5px Archivo,sans-serif;color:var(--ink-3);background:none;border:0;padding:6px 6px 10px;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap}
.step span{width:18px;height:18px;border-radius:50%;border:1px solid var(--rule-2);display:inline-grid;place-items:center;font-size:10.5px}
.step em{font-style:normal;display:none}.step.on em{display:inline}.step{flex:0 0 auto}#steps{justify-content:space-between}
.step.on{color:var(--ink)}.step.on span{background:var(--accent);border-color:var(--accent);color:#fff}
.step.done span{background:var(--ink);border-color:var(--ink);color:#fff}
.bar{height:3px;background:var(--rule);border-radius:2px;overflow:hidden}
#progress{height:100%;background:var(--accent);transition:width .25s}
#step-body{flex:1;overflow:auto;padding:16px 20px 20px}
h2{font-size:20px;margin:4px 0 4px;letter-spacing:-.01em}
.lede{color:var(--ink-2);margin:0 0 16px;font-size:14px}
.grp{margin:0 0 18px}
.gl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;font:600 13px Archivo,sans-serif;padding:9px 12px;border-radius:8px;border:1px solid var(--rule-2);background:var(--surface);color:var(--ink);cursor:pointer;min-width:96px;text-align:left}
.chip.pic{align-items:center;text-align:center;min-width:84px}
.chip i{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.15);margin-bottom:4px}
.chip small,.card small,.tog small{font:400 11.5px 'IBM Plex Mono',monospace;color:var(--ink-3)}
.chip[aria-pressed="true"],.card[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.chip[aria-pressed="true"] small,.card[aria-pressed="true"] small{color:var(--accent)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.sizes .chip{min-width:120px}
.cards{display:grid;gap:8px}
.card{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;padding:11px 13px;border-radius:8px;border:1px solid var(--rule-2);background:var(--surface);cursor:pointer;font:inherit;color:inherit}
.card b{font-size:14px}.card span{grid-column:1;color:var(--ink-2);font-size:12.5px}.card small{grid-row:1/3;grid-column:2;align-self:center}
.tog{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--rule-2);border-radius:8px;margin-bottom:8px;cursor:pointer;font-weight:600;font-size:13px}
.tog input{accent-color:var(--accent);width:16px;height:16px}
.note{font-size:12.5px;color:var(--ink-2);margin:8px 0 0}
.lock{font-size:12.5px;color:#8a5a12;background:#FBF1DE;border-radius:6px;padding:7px 10px;margin:8px 0 0}
.callout{border-left:3px solid var(--accent);background:#FBF7F2;padding:10px 12px;border-radius:0 8px 8px 0;font-size:13.5px}
.callout.use{margin:0 0 16px}
.callout .fits{display:flex;gap:10px;margin-top:8px;font-size:12.5px}
.callout .fits span{flex:none;font-weight:700;color:var(--ink-2);white-space:nowrap}
.callout .fits ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px 6px}
.callout .fits li{background:#fff;border:1px solid var(--rule);border-radius:999px;padding:2px 8px}
.callout .up{margin:8px 0 0;font-size:12.5px;color:var(--ink-2)}
button.link{font:inherit;font-weight:700;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.row.uses .chip{min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12.5px Archivo,sans-serif;padding:6px 10px;border-radius:999px;border:1px solid var(--rule-2);background:var(--surface);color:var(--ink);cursor:pointer}
.pill span{color:var(--ink-3);font-size:14px;line-height:1}.pill:hover{border-color:var(--accent)}.pill:hover span{color:var(--accent)}
select.add{margin-top:8px;font:500 13px Archivo,sans-serif;padding:8px 10px;border-radius:8px;border:1px dashed var(--rule-2);background:var(--surface);color:var(--ink-2);max-width:100%}
.dims{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 0}
.dims div{border:1px solid var(--rule);border-radius:8px;padding:8px 10px}
.dims dt{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.1em}
.dims dd{margin:0;font:500 14px 'IBM Plex Mono',monospace}
.rv{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.rvh{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.rv ul{list-style:none;margin:0;padding:0}
.rv li{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-size:13.5px}
.rv li b{font:500 13px 'IBM Plex Mono',monospace;white-space:nowrap}
.rv .inc li{display:list-item;list-style:'✓  ';margin-left:16px;color:var(--ink-2);font-size:12.5px;padding:2px 0}
.rv summary{cursor:pointer;font-size:12.5px;color:var(--ink-2);margin-top:4px}
.rv.tot li.big{font-size:16px;font-weight:700;border-top:1px solid var(--rule);margin-top:4px;padding-top:8px}
.rv.tot li.big b{font-size:16px;color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.abtn{font:600 12.5px Archivo,sans-serif;padding:9px 13px;border-radius:8px;border:1px solid var(--rule-2);background:var(--surface);cursor:pointer;color:var(--ink)}
.said{font-size:12px;color:var(--ok)}
.foot{border-top:1px solid var(--rule);padding:12px 20px;display:flex;align-items:center;gap:10px;background:var(--surface)}
.foot .fp{line-height:1.2}.foot .fp strong{font-size:18px}.foot .fp span{display:block;font-size:11px;color:var(--ink-3)}
#b-next{margin-left:auto;font:700 13.5px Archivo,sans-serif;padding:12px 16px;border-radius:8px;border:0;background:var(--ink);color:#fff;cursor:pointer}
#b-back{font:600 13px Archivo,sans-serif;padding:11px 12px;border-radius:8px;border:1px solid var(--rule-2);background:var(--surface);cursor:pointer}
.qr{position:absolute;right:14px;bottom:70px;z-index:3;display:flex;gap:14px;align-items:flex-start;background:var(--surface);border-radius:12px;padding:14px;box-shadow:var(--shadow);max-width:340px}
.qr[hidden]{display:none}
#qrbox{width:132px;height:132px;flex:none;display:grid;place-items:center;background:#fff}
#qrbox svg{width:100%;height:100%}
.qr p{margin:4px 0 10px;font-size:13px;color:var(--ink-2)}
#ar-mv{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:0;top:0}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-3);font-size:13px;pointer-events:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:900px){
  .layout{grid-template-columns:1fr;height:auto}
  .stagewrap{height:58vh;position:sticky;top:0;z-index:1}
  aside{border-left:0;border-top:1px solid var(--rule)}
  .hprice span{display:none}
  .ov.bl{display:none}
  .foot{position:sticky;bottom:0}
}
@media print{
  header .hprice,.ov,.foot,.stepper,.actions,.qr{display:none!important}
  .layout{display:block;height:auto}.stagewrap{height:360px}
  aside{border:0}#step-body{overflow:visible}
}
</style>
</head>
<body>
<header>
  <div class="brand">WUNDER<b>SHED</b></div>
  <div class="mname"><strong id="m-name">WunderStudio</strong><span id="m-size"></span></div>
  <div class="hprice"><strong id="p-total">—</strong><span id="p-pre"></span></div>
</header>
<div class="layout">
  <div class="stagewrap">
    <div class="loading">Building your studio…</div>
    <div id="stage"></div>
    <div class="ov tl" role="group" aria-label="Background">
      <button class="ob" data-bg="yard">Backyard</button><button class="ob" data-bg="studio">Studio</button><button class="ob" data-bg="dusk">Dusk</button>
    </div>
    <div class="ov tr" role="group" aria-label="View">
      <button class="ob" data-view="out">Outside</button><button class="ob" data-view="in">Inside</button>
    </div>
    <div class="ov bl" role="group" aria-label="Camera">
      <button class="ob" data-cam="home">Home</button><button class="ob" data-cam="front">Front</button><button class="ob" data-cam="side">Side</button>
    </div>
    <div class="ov br">
      <button class="arbtn" id="b-ar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="m3 7 9 5 9-5M12 12v10"/></svg>View in your yard</button>
    </div>
    <div class="qr" id="qr" hidden>
      <div id="qrbox"></div>
      <div><b>Scan with your phone</b><p>AR needs a phone camera. This opens your exact design on your phone; tap <b>View in your yard</b> and walk around it at true size.</p><button class="abtn" id="qr-close">Close</button></div>
    </div>
    <model-viewer id="ar-mv" ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" ar-placement="floor" loading="eager" reveal="auto" alt="Your Wundershed in AR"></model-viewer>
  </div>
  <aside>
    <div class="stepper"><div id="steps"></div><div class="bar"><div id="progress"></div></div></div>
    <div id="step-body"></div>
    <div class="foot">
      <button id="b-back">Back</button>
      <div class="fp"><strong id="f-total"></strong><span id="p-note"></span></div>
      <button id="b-next">Next</button>
    </div>
  </aside>
</div>
<script type="module" src="app/main.js"></script>
</body>
</html>
